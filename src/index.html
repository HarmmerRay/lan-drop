<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LanDrop</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <h1>LanDrop</h1>
      </div>
      <div class="header-right">
        <div class="my-info">
          <span class="device-name" id="myDeviceName">我的设备</span>
          <span class="status-dot online" id="statusDot"></span>
          <span class="status-text" id="statusText">在线</span>
        </div>
        <button class="btn btn-icon" id="btnSettings" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Left: Device list -->
      <section class="panel devices-panel">
        <div class="panel-header">
          <h2>局域网设备</h2>
          <button class="btn btn-icon" id="btnRefresh" title="刷新">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
        <div class="device-list" id="deviceList">
          <div class="empty-state" id="emptyDevices">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <p>正在搜索局域网设备...</p>
            <p class="hint">确保对方也打开了 LanDrop</p>
          </div>
        </div>
      </section>

      <!-- Right: Transfer area -->
      <section class="panel transfer-panel">
        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <p>拖拽文件到这里发送</p>
          <p class="hint">或</p>
          <button class="btn btn-primary" id="btnSelectFile">选择文件</button>
          <input type="file" id="fileInput" multiple hidden />
        </div>

        <!-- Selected files -->
        <div class="selected-files" id="selectedFiles" style="display:none">
          <h3>待发送文件</h3>
          <div class="file-list" id="fileList"></div>
          <div class="transfer-actions">
            <button class="btn btn-primary btn-lg" id="btnSend" disabled>
              发送到选中设备
            </button>
          </div>
        </div>

        <!-- Transfer progress -->
        <div class="transfers" id="transfers" style="display:none">
          <h3>传输记录</h3>
          <div id="transferList"></div>
        </div>
      </section>
    </main>

    <!-- Settings panel (slide-in from right) -->
    <div class="settings-overlay" id="settingsOverlay" style="display:none">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>设置</h2>
          <button class="btn btn-icon" id="btnCloseSettings" title="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="settings-body">
          <!-- Version info -->
          <div class="settings-section">
            <h3>关于</h3>
            <div class="settings-row">
              <span class="label">版本</span>
              <span class="value" id="appVersion">-</span>
            </div>
            <div class="settings-row">
              <span class="label">设备名</span>
              <span class="value" id="settingsDeviceName">-</span>
            </div>
          </div>

          <!-- Update -->
          <div class="settings-section">
            <h3>更新</h3>
            <div class="settings-row">
              <span class="label">更新地址</span>
              <span class="value value-small" id="updateUrl">sub.hugme.space/landrop</span>
            </div>
            <button class="btn btn-primary btn-block" id="btnCheckUpdate">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
              检查更新
            </button>
            <div class="update-status" id="updateStatus"></div>
          </div>

          <!-- Download dir -->
          <div class="settings-section">
            <h3>接收</h3>
            <div class="settings-row">
              <span class="label">保存到</span>
              <span class="value value-small">~/Downloads/LanDrop/</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Receive modal -->
    <div class="modal-overlay" id="receiveModal" style="display:none">
      <div class="modal">
        <h3>收到文件</h3>
        <div class="receive-info" id="receiveInfo"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="btnReject">拒绝</button>
          <button class="btn btn-primary" id="btnAccept">接受</button>
        </div>
      </div>
    </div>

    <!-- Update modal -->
    <div class="modal-overlay" id="updateModal" style="display:none">
      <div class="modal">
        <h3>发现新版本</h3>
        <div class="update-info" id="updateInfo"></div>
        <div class="update-progress" id="updateProgress" style="display:none">
          <div class="progress-bar">
            <div class="progress-fill" id="updateProgressFill"></div>
          </div>
          <span class="update-progress-text" id="updateProgressText">0%</span>
        </div>
        <div class="modal-actions" id="updateModalActions">
          <button class="btn btn-secondary" id="btnUpdateLater">稍后</button>
          <button class="btn btn-primary" id="btnUpdateNow">立即更新</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
